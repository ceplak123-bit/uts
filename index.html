<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transportasi Umrah & Haji</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; }
        .container { max-width: 700px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 50px; }
        h1 { text-align: center; color: #1a4d2e; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 25px; font-size: 14px; }
        label { font-weight: bold; margin-top: 15px; display: block; color: #333; font-size: 14px; }
        select, input { width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; background-color: #fafafa; }
        select:focus, input:focus { outline: none; border-color: #1a4d2e; box-shadow: 0 0 5px rgba(26, 77, 46, 0.2); }
        select:disabled { background-color: #e9ecef; color: #999; cursor: not-allowed; }
        .price-box { margin-top: 25px; padding: 20px; background-color: #e8f5e9; border-left: 5px solid #1a4d2e; font-size: 22px; font-weight: bold; text-align: center; color: #1a4d2e; border-radius: 4px; transition: 0.3s; }
        .btn-group { display: flex; gap: 10px; margin-top: 25px; }
        .btn { display: block; width: 100%; padding: 15px; color: white; text-align: center; font-size: 16px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; text-decoration: none; box-sizing: border-box; transition: 0.3s; }
        .btn-email { background-color: #0056b3; } .btn-email:hover { background-color: #004494; transform: translateY(-2px); }
        .btn-wa { background-color: #25D366; } .btn-wa:hover { background-color: #1ebe5d; transform: translateY(-2px); }
        .note { text-align: center; font-size: 12px; color: #888; margin-top: 15px; }
        .form-section { margin-top: 20px; padding-top: 20px; border-top: 1px dashed #ccc; display: none; }
        .loading { text-align: center; font-weight: bold; color: #0056b3; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Umrah Transport Service</h1>
    <div class="subtitle">Safe, Comfortable, Professional</div>
    <div id="loadingText" class="loading">Memuat data...</div>

    <label for="rute">1. Pilih Rute Perjalanan:</label>
    <select id="rute"><option value="">-- Pilih Rute --</option></select>

    <label for="kendaraan">2. Pilih Jenis Kendaraan:</label>
    <select id="kendaraan" disabled><option value="">-- Pilih Rute Terlebih Dahulu --</option></select>

    <div class="price-box" id="hasilHarga">Total: 0 SAR</div>

    <div class="form-section" id="formPemesanan">
        <h3 style="margin-top:0; color:#1a4d2e; font-size:16px;">Detail Pemesanan</h3>
        <label>Nama Pemesan:</label><input type="text" id="namaPemesan">
        <label>Tanggal & Jam Penjemputan:</label><input type="datetime-local" id="waktuJemput">
        <label id="labelJemput">Titik Penjemputan:</label><input type="text" id="titikJemput">
        <div id="divTujuan" style="display:none;"><label>Titik Tujuan (Hotel):</label><input type="text" id="titikTujuan"></div>
        <div id="divFlight" style="display:none;"><label>No. Penerbangan:</label><input type="text" id="noPenerbangan"></div>
    </div>

    <div class="btn-group" id="divTombol" style="display:none;">
        <a href="#" id="btnEmail" class="btn btn-email">Pesan via Email</a>
        <a href="#" id="btnWA" class="btn btn-wa">Pesan via WhatsApp</a>
    </div>
    <div class="note">*Harga dapat berubah sewaktu-waktu.</div>
</div>

        // R19: Jeddah Apt - Jeddah Hotel
        "V01-R19": 170, "V13-R19": 170, "V04-R19": 720, "V05-R19": 190, "V07-R19": 220, "V08-R19": 370, "V09-R19": 1050, "IND-GMC-R19": 770, "IND-STR-R19": 240, "IND-HIA-R19": 270,

        // R21 & R22: Fulltrips
        "V01-R21": 1000, "V13-R21": 1000, "V04-R21": 4500, "V05-R21": 1350, "V07-R21": 1500, "V08-R21": 2400, "V09-R21": 2500, "V10-R21": 3500, "V11-R21": 5800, "V12-R21": 4500, "IND-GMC-R21": 4550, "IND-STR-R21": 1400, "IND-HIA-R21": 1550,
        "V01-R22": 1400, "V13-R22": 1400, "V04-R22": 4800, "V05-R22": 1800, "V07-R22": 1900, "V08-R22": 2500, "V09-R22": 2600, "V10-R22": 3700, "V11-R22": 6800, "V12-R22": 4800, "IND-GMC-R22": 4850, "IND-STR-R22": 1850, "IND-HIA-R22": 1950
    };

    let dbVehicles = [], dbRoutes = [], dbPrices = {};
    let selectRute, selectKendaraan;
    const emailAdmin = "pesanmobilmakkah@gmail.com"; 
    const waAdmin = "62881011154839"; 

    async function fetchDataFromDrive() {
        document.getElementById('loadingText').style.display = 'block';
        try {
            const response = await fetch(`${API_URL}?action=read`);
            const data = await response.json();
            
            // JIKA DRIVE KOSONG ATAU BELUM ADA DATA "ACTIVE", GUNAKAN DEFAULT
            if (data.kendaraan && data.kendaraan.length > 0 && data.kendaraan[0].hasOwnProperty('active')) {
                dbVehicles = data.kendaraan; dbRoutes = data.rute; dbPrices = data.harga;
            } else {
                dbVehicles = defaultVehicles; dbRoutes = defaultRoutes; dbPrices = defaultPrices;
            }
        } catch (error) {
            dbVehicles = defaultVehicles; dbRoutes = defaultRoutes; dbPrices = defaultPrices;
        }
        
        localStorage.setItem('db_kendaraan', JSON.stringify(dbVehicles));
        localStorage.setItem('db_rute', JSON.stringify(dbRoutes));
        localStorage.setItem('db_harga', JSON.stringify(dbPrices));
        
        document.getElementById('loadingText').style.display = 'none';
        initUI();
    }

    function initUI() {
        selectRute = document.getElementById('rute');
        selectKendaraan = document.getElementById('kendaraan');
        
        // HANYA TAMPILKAN RUTE YANG AKTIF
        const activeRoutes = dbRoutes.filter(r => r.active !== false);
        
        selectRute.innerHTML = '<option value="">-- Pilih Rute --</option>';
        activeRoutes.forEach(r => {
            const opt = document.createElement('option'); opt.value = r.id; opt.textContent = r.name; selectRute.appendChild(opt);
        });

        selectRute.addEventListener('change', filterKendaraan);
        selectKendaraan.addEventListener('change', tampilkanForm);
        ['namaPemesan', 'waktuJemput', 'titikJemput', 'titikTujuan', 'noPenerbangan'].forEach(id => {
            document.getElementById(id).addEventListener('input', updatePesanan);
        });
    }

    function filterKendaraan() {
        const rute = selectRute.value;
        const teksRute = selectRute.options[selectRute.selectedIndex]?.text || "";
        selectKendaraan.innerHTML = '<option value="">-- Pilih Kendaraan --</option>';
        document.getElementById('hasilHarga').innerHTML = `Total: 0 SAR`;
        document.getElementById('divTombol').style.display = "none";
        document.getElementById('formPemesanan').style.display = "none";

        if (!rute) { selectKendaraan.disabled = true; selectKendaraan.innerHTML = '<option value="">-- Pilih Rute Dahulu --</option>'; return; }

        const isAirport = teksRute.toLowerCase().includes("airport");
        document.getElementById('divTujuan').style.display = isAirport ? "block" : "none";
        document.getElementById('divFlight').style.display = isAirport ? "block" : "none";
        document.getElementById('labelJemput').innerText = isAirport ? "Titik Penjemputan / Bandara:" : "Titik Penjemputan / Hotel:";

        selectKendaraan.disabled = false;
        const groups = {};
        
        // HANYA TAMPILKAN KENDARAAN YANG AKTIF
        const activeVehicles = dbVehicles.filter(v => v.active !== false);

        activeVehicles.forEach(v => {
            if(!groups[v.group]) groups[v.group] = [];
            if (dbPrices[`${v.id}-${rute}`] !== undefined) groups[v.group].push(v);
        });

        for (const [groupName, vehicles] of Object.entries(groups)) {
            if (vehicles.length > 0) {
                const optGroup = document.createElement('optgroup'); optGroup.label = groupName;
                vehicles.forEach(v => {
                    const opt = document.createElement('option'); opt.value = v.id; opt.textContent = `${v.name} - ${v.pax} Pax`; optGroup.appendChild(opt);
                });
                selectKendaraan.appendChild(optGroup);
            }
        }
    }

    function tampilkanForm() {
        if (selectKendaraan.value) { document.getElementById('formPemesanan').style.display = "block"; updatePesanan(); } 
        else { document.getElementById('formPemesanan').style.display = "none"; document.getElementById('divTombol').style.display = "none"; }
    }

    function updatePesanan() {
        const rute = selectRute.value; const kendaraan = selectKendaraan.value;
        if (!rute || !kendaraan) return;
        const harga = dbPrices[`${kendaraan}-${rute}`];
        if (harga) {
            document.getElementById('hasilHarga').innerHTML = `Total: ${harga} SAR`;
            const nama = document.getElementById('namaPemesan').value || "(Belum diisi)";
            const waktu = document.getElementById('waktuJemput').value || "(Belum diisi)";
            const jemput = document.getElementById('titikJemput').value || "(Belum diisi)";
            const isAirport = document.getElementById('divTujuan').style.display === "block";
            const tujuan = isAirport ? (document.getElementById('titikTujuan').value || "-") : "-";
            const flight = isAirport ? (document.getElementById('noPenerbangan').value || "-") : "-";

            document.getElementById('divTombol').style.display = (nama !== "(Belum diisi)" && waktu !== "(Belum diisi)" && jemput !== "(Belum diisi)") ? "flex" : "none";
            
            const teksRute = selectRute.options[selectRute.selectedIndex].text; const teksKendaraan = selectKendaraan.options[selectKendaraan.selectedIndex].text;
            let isiPesanText = `Halo Admin, saya ingin memesan:\n\n👤 Nama: ${nama}\n📅 Waktu: ${waktu.replace('T', ' | ')}\n`;
            if (flight !== "-") isiPesanText += `✈️ Penerbangan: ${flight}\n`;
            isiPesanText += `\n📍 Rute: ${teksRute}\n🏨 Jemput: ${jemput}\n🏨 Tujuan: ${tujuan}\n🚗 Kendaraan: ${teksKendaraan}\n💰 Total: ${harga} SAR\n\nMohon konfirmasi. Terima kasih.`;

            const isiPesanEncoded = encodeURIComponent(isiPesanText);
            document.getElementById('btnEmail').href = `mailto:${emailAdmin}?subject=Pesanan Baru: ${nama}&body=${isiPesanEncoded}`;
            document.getElementById('btnWA').href = `https://wa.me/${waAdmin}?text=${isiPesanEncoded}`;
            document.getElementById('btnEmail').onclick = () => simpanPesananLokal(nama, waktu, jemput, tujuan, flight, teksRute, teksKendaraan, harga);
            document.getElementById('btnWA').onclick = () => simpanPesananLokal(nama, waktu, jemput, tujuan, flight, teksRute, teksKendaraan, harga);
        }
    }

    function simpanPesananLokal(nama, waktu, jemput, tujuan, flight, rute, kendaraan, harga) {
        let pesanan = JSON.parse(localStorage.getItem('dataPesanan')) || [];
        const idPesanan = 'INV-' + Math.floor(Math.random() * 1000000);
        pesanan.push({ id: idPesanan, tanggalPesan: new Date().toLocaleString(), nama, waktuJemput: waktu, titikJemput: jemput, titikTujuan: tujuan, noFlight: flight, rute, kendaraan, harga, status: "Pending", driver: "-", driverPhone: "-" });
        localStorage.setItem('dataPesanan', JSON.stringify(pesanan));
        alert(`Pesanan ${idPesanan} berhasil dibuat!`);
    }

    document.addEventListener('DOMContentLoaded', fetchDataFromDrive);
</script>
</body>
</html>
