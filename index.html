<script>
    // ==========================================
    // KONFIGURASI API GOOGLE DRIVE
    // ==========================================
    // GANTI DENGAN URL WEB APP YANG ANDA DAPATKAN DARI LANGKAH 3
    const API_URL = 'MASUKKAN_URL_WEB_APP_ANDA_DI_SINI';

    // Data default (fallback jika Drive kosong/offline)
    const defaultVehicles = [
        { id: "V01", name: "Sedan (Camry/Sonata)", pax: 4, group: "Reguler" },
        { id: "V13", name: "Hyundai Stargazer", pax: 4, group: "Reguler" },
        { id: "V04", name: "GMC (Yukon/New Model)", pax: 6, group: "Reguler" },
        { id: "IND-GMC", name: "⭐ GMC + Driver Indonesia", pax: 6, group: "Layanan Spesial" }
    ];
    const defaultRoutes = [
        { id: "R01", name: "Jeddah Airport to Makkah Hotel" },
        { id: "R02", name: "Madinah Airport to Madinah Hotel" }
    ];
    const defaultPrices = {
        "V01-R01": 175, "V13-R01": 175, "V04-R01": 500, "IND-GMC-R01": 550
    };

    // Variabel global
    let dbVehicles = [];
    let dbRoutes = [];
    let dbPrices = {};
    let selectRute, selectKendaraan;

    // ==========================================
    // FUNGSI MENGAMBIL DATA DARI GOOGLE DRIVE
    // ==========================================
    async function fetchDataFromDrive() {
        try {
            const response = await fetch(`${API_URL}?action=read`);
            if (!response.ok) throw new Error('Network response was not ok');
            const data = await response.json();
            
            // Simpan ke localStorage sebagai cache offline
            if (data.kendaraan && data.kendaraan.length > 0) {
                dbVehicles = data.kendaraan;
                dbRoutes = data.rute;
                dbPrices = data.harga;
                localStorage.setItem('db_kendaraan', JSON.stringify(dbVehicles));
                localStorage.setItem('db_rute', JSON.stringify(dbRoutes));
                localStorage.setItem('db_harga', JSON.stringify(dbPrices));
            } else {
                // Jika Drive kosong, gunakan default
                loadDefaultData();
            }
        } catch (error) {
            console.warn('Gagal mengambil dari Drive, menggunakan cache lokal:', error);
            loadFromLocalStorage();
        }
        initUI();
    }

    function loadDefaultData() {
        dbVehicles = defaultVehicles;
        dbRoutes = defaultRoutes;
        dbPrices = defaultPrices;
        saveToLocalStorage();
    }

    function loadFromLocalStorage() {
        dbVehicles = JSON.parse(localStorage.getItem('db_kendaraan')) || defaultVehicles;
        dbRoutes = JSON.parse(localStorage.getItem('db_rute')) || defaultRoutes;
        dbPrices = JSON.parse(localStorage.getItem('db_harga')) || defaultPrices;
    }

    function saveToLocalStorage() {
        localStorage.setItem('db_kendaraan', JSON.stringify(dbVehicles));
        localStorage.setItem('db_rute', JSON.stringify(dbRoutes));
        localStorage.setItem('db_harga', JSON.stringify(dbPrices));
    }

    // ==========================================
    // INISIALISASI UI
    // ==========================================
    function initUI() {
        selectRute = document.getElementById('rute');
        selectKendaraan = document.getElementById('kendaraan');
        
        // Isi dropdown rute
        selectRute.innerHTML = '<option value="">-- Pilih Rute --</option>';
        dbRoutes.forEach(r => {
            const opt = document.createElement('option');
            opt.value = r.id;
            opt.textContent = r.name;
            selectRute.appendChild(opt);
        });

        // Pasang event listener
        selectRute.addEventListener('change', filterKendaraan);
        selectKendaraan.addEventListener('change', tampilkanForm);
        
        ['namaPemesan', 'waktuJemput', 'titikJemput', 'titikTujuan', 'noPenerbangan'].forEach(id => {
            const el = document.getElementById(id);
            if(el) el.addEventListener('input', updatePesanan);
        });
    }

    // ==========================================
    // FUNGSI-FUNGSI LAINNYA (Sama seperti sebelumnya)
    // ==========================================
    // Salin fungsi filterKendaraan, tampilkanForm, updatePesanan, simpanKeDatabase
    // dari kode index.html Anda yang sebelumnya ke sini.
    // (Pastikan menggunakan variabel dbVehicles, dbRoutes, dbPrices yang sudah dideklarasikan di atas)

    function filterKendaraan() {
        const rute = selectRute.value;
        const teksRute = selectRute.options[selectRute.selectedIndex]?.text || "";
        selectKendaraan.innerHTML = '<option value="">-- Pilih Kendaraan --</option>';
        document.getElementById('hasilHarga').innerHTML = `Total: 0 SAR`;
        document.getElementById('divTombol').style.display = "none";
        document.getElementById('formPemesanan').style.display = "none";

        if (!rute) {
            selectKendaraan.disabled = true;
            selectKendaraan.innerHTML = '<option value="">-- Pilih Rute Terlebih Dahulu --</option>';
            return;
        }

        const isAirport = teksRute.toLowerCase().includes("airport");
        document.getElementById('divTujuan').style.display = isAirport ? "block" : "none";
        document.getElementById('divFlight').style.display = isAirport ? "block" : "none";
        document.getElementById('labelJemput').innerText = isAirport ? "Titik Penjemputan / Bandara:" : "Titik Penjemputan / Hotel:";

        selectKendaraan.disabled = false;
        const groups = {};
        dbVehicles.forEach(v => {
            if(!groups[v.group]) groups[v.group] = [];
            if (dbPrices[`${v.id}-${rute}`] !== undefined) {
                groups[v.group].push(v);
            }
        });

        for (const [groupName, vehicles] of Object.entries(groups)) {
            if (vehicles.length > 0) {
                const optGroup = document.createElement('optgroup');
                optGroup.label = groupName;
                vehicles.forEach(v => {
                    const opt = document.createElement('option');
                    opt.value = v.id;
                    opt.textContent = `${v.name} - ${v.pax} Pax`;
                    optGroup.appendChild(opt);
                });
                selectKendaraan.appendChild(optGroup);
            }
        }
    }

    function tampilkanForm() {
        if (selectKendaraan.value) {
            document.getElementById('formPemesanan').style.display = "block";
            updatePesanan();
        } else {
            document.getElementById('formPemesanan').style.display = "none";
            document.getElementById('divTombol').style.display = "none";
        }
    }

    function updatePesanan() {
        const rute = selectRute.value;
        const kendaraan = selectKendaraan.value;
        if (!rute || !kendaraan) return;
        const harga = dbPrices[`${kendaraan}-${rute}`];
        if (harga) {
            document.getElementById('hasilHarga').innerHTML = `Total: ${harga} SAR`;
            const nama = document.getElementById('namaPemesan').value || "(Belum diisi)";
            const waktu = document.getElementById('waktuJemput').value || "(Belum diisi)";
            const jemput = document.getElementById('titikJemput').value || "(Belum diisi)";
            const isAirport = document.getElementById('divTujuan').style.display === "block";
            const tujuan = isAirport ? (document.getElementById('titikTujuan').value || "(Belum diisi)") : "-";
            const flight = isAirport ? (document.getElementById('noPenerbangan').value || "-") : "-";

            document.getElementById('divTombol').style.display = (nama !== "(Belum diisi)" && waktu !== "(Belum diisi)" && jemput !== "(Belum diisi)") ? "flex" : "none";
            // ... (sisa logika pembuatan pesan WA/Email sama seperti sebelumnya)
        }
    }

    // ==========================================
    // MULAI APLIKASI
    // ==========================================
    document.addEventListener('DOMContentLoaded', fetchDataFromDrive);
</script>
