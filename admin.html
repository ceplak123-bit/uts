<script>
    // ==========================================
    // KONFIGURASI API GOOGLE DRIVE
    // ==========================================
    // GANTI DENGAN URL WEB APP YANG SAMA SEPERTI DI INDEX.HTML
    const API_URL = 'MASUKKAN_URL_WEB_APP_ANDA_DI_SINI';

    // Variabel global
    let pesanan = [];
    let dbVehicles = [];
    let dbRoutes = [];
    let dbPrices = {};

    // ==========================================
    // FUNGSI SINKRONISASI
    // ==========================================
    async function syncToDrive() {
        const data = {
            action: 'write',
            data: {
                kendaraan: dbVehicles,
                rute: dbRoutes,
                harga: dbPrices,
                pesanan: pesanan
            }
        };
        try {
            await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify(data)
            });
            console.log('Data berhasil disinkronkan ke Google Drive');
        } catch (error) {
            console.error('Gagal sinkronisasi ke Drive:', error);
        }
    }

    async function loadDataFromDrive() {
        try {
            const response = await fetch(`${API_URL}?action=read`);
            const data = await response.json();
            
            dbVehicles = data.kendaraan || [];
            dbRoutes = data.rute || [];
            dbPrices = data.harga || {};
            pesanan = data.pesanan || [];
            
            // Simpan cadangan ke localStorage
            localStorage.setItem('db_kendaraan', JSON.stringify(dbVehicles));
            localStorage.setItem('db_rute', JSON.stringify(dbRoutes));
            localStorage.setItem('db_harga', JSON.stringify(dbPrices));
            localStorage.setItem('dataPesanan', JSON.stringify(pesanan));
            
        } catch (error) {
            console.warn('Gagal memuat dari Drive, menggunakan cache lokal.');
            // Fallback ke localStorage
            dbVehicles = JSON.parse(localStorage.getItem('db_kendaraan')) || [];
            dbRoutes = JSON.parse(localStorage.getItem('db_rute')) || [];
            dbPrices = JSON.parse(localStorage.getItem('db_harga')) || {};
            pesanan = JSON.parse(localStorage.getItem('dataPesanan')) || [];
        }
        
        renderAll();
    }

    function renderAll() {
        renderTabelPesanan();
        // Pastikan fungsi render master data (jika ada) juga dipanggil di sini
    }

    // ==========================================
    // MODIFIKASI FUNGSI PENYIMPANAN
    // ==========================================
    // Setiap kali ada perubahan data, panggil syncToDrive()

    // Contoh: Pada fungsi simpanPesananManual()
    function simpanPesananManual() {
        // ... (logika pengambilan data dari form)
        // pesanan.push(dataBaru);
        
        // Simpan ke localStorage (cache)
        localStorage.setItem('dataPesanan', JSON.stringify(pesanan));
        
        // Sinkronkan ke Google Drive
        syncToDrive();
        
        renderTabelPesanan();
    }

    // Contoh: Pada fungsi hapusMobil()
    function hapusMobil(id) {
        if(confirm('Hapus mobil ini?')) {
            dbVehicles = dbVehicles.filter(v => v.id !== id);
            for (const key in dbPrices) { if (key.startsWith(id + '-')) delete dbPrices[key]; }
            
            localStorage.setItem('db_kendaraan', JSON.stringify(dbVehicles));
            localStorage.setItem('db_harga', JSON.stringify(dbPrices));
            
            syncToDrive(); // Sinkronkan perubahan
            renderTabelMobil(); renderTabelHarga();
        }
    }

    // Lakukan hal yang sama untuk fungsi simpanHarga, simpanMobil, simpanRute, updateStatus, dll.
    // Pastikan setiap akhir fungsi yang mengubah data, panggil `syncToDrive();`

    // ==========================================
    // MULAI APLIKASI
    // ==========================================
    document.addEventListener('DOMContentLoaded', loadDataFromDrive);
</script>
